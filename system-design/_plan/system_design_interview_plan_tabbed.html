    <style>

<script>window.PLAN_MARKDOWN = "# System Design Interview Preparation — American Express Solution Architect\n\n**Interview:** Wednesday, November 4, 2026  \n**Goal:** Develop broad coverage of system-design patterns with extra depth in payments and enterprise architecture.  \n**Learning style:** Worked designs, explicit trade-offs, brief concepts at point of use. **No quizzes, mock interviews, timed blocks, or assessments.**\n\n## 1. Overview\n\n### Core strategy\n\nStudy **73 system-design problems across 8 modules**, but do **not** memorize 73 isolated diagrams. Understand the reusable architectural decisions underneath them. Cover the breadth first; then deepen the problems that combine the most essential patterns.\n\n1. **Decision-first:** Start with a real requirement, then derive each component from it.\n2. **One baseline before complexity:** Begin with the simplest acceptable design, and add components only to address a named constraint.\n3. **Explain choices:** For every database, protocol, queue, cache, and deployment choice, compare plausible alternatives.\n4. **Use financial examples as an anchor:** Payments, ledgers, fraud, reconciliation, security and auditability expose important correctness requirements.\n5. **Think like a Solution Architect:** Include existing systems, integration contracts, organizational ownership, cost, migration, governance and operational readiness.\n6. **No assessments:** This is a guided reference and explanation plan, not an examination program.\n\n### Success criteria\n\n- Recognize core architectural patterns when a new problem is described.\n- Explain **why** a design fits its constraints and **when** it would stop fitting.\n- Describe data flow, state ownership, consistency, failure recovery, and security boundaries clearly.\n- Reuse solved patterns across domains without forcing the same technology into every design.\n\n### Scope and priorities\n\n| Track | Coverage | Treatment |\n|---|---:|---|\n| Architecture fundamentals | 20 connected concepts | Explain in context, before or during designs |\n| Payments / financial systems | 16 case studies | Highest domain depth |\n| Scalable applications | 12 case studies | Broad reusable patterns |\n| Distributed transactions / workflows | 10 case studies | Consistency and failure depth |\n| Data and streaming | 9 case studies | Batch/stream/data ownership |\n| Reliability and cloud | 9 case studies | High-availability and recovery |\n| Security and enterprise | 9 case studies | Solution Architect lens |\n| Advanced systems | 8 case studies | Breadth/extensions |\n| **Total design cases** | **73** | **16 recommended full deep dives** |\n\n**Important:** This plan is tailored to the Solution Architect role and financial-services domain. It is **not** a claim that American Express will ask these exact questions.\n\n## 2. Method — How Each Design Is Explained\n\nUse this structure consistently; increase or decrease detail according to the case.\n\n| Step | What we cover | Why it comes now |\n|---|---|---|\n| 1. Define the problem | Actors, system boundary, success criteria, functional requirements | Prevent building the wrong system |\n| 2. Rank constraints | Correctness, security, latency, availability, throughput, cost | Architectural choices depend on priorities |\n| 3. Scale and assumptions | Requests/sec, peak factors, read/write ratio, storage, retention; label unknowns | Quantifies which optimizations are necessary |\n| 4. Interfaces | APIs, commands/events, error semantics, idempotency contracts | Establishes behavior before components |\n| 5. State and data | Entities, source of truth, key constraints, consistency | Financial errors usually start here |\n| 6. Minimum viable architecture | Services, database, synchronous path, external systems | Avoid needless complexity |\n| 7. Derive design choices | Alternatives, chosen option, why alternatives lose | Demonstrates architecture judgment |\n| 8. Walk critical flows | Success, retry, duplicate, timeout, failure, recovery | Exposes hidden state transitions |\n| 9. Scale and protect | Partitioning, cache, rate limits, backpressure, observability | Add only where justified |\n| 10. Enterprise review | Security, compliance, migration, ownership, DR, cost | Makes it an operational solution |\n| 11. Final diagram and trade-offs | ASCII architecture and explicit limitations | Communicates the complete design |\n\n### Example: deriving a payment API\n\n**Problem:** A merchant calls an API to authorize a payment. The merchant may retry after a timeout, and processing depends on an external payment network.\n\n1. **Requirement — one logical operation:** A repeated client request must not create a second financial operation. **Choice:** accept an idempotency key; bind it to a request fingerprint and persist an operation record. **Why:** networks can time out after the server has begun work.\n2. **Requirement — durable state:** Payment state changes need atomic constraints. **Choice:** begin with a relational transactional store. **Why:** uniqueness and state transitions matter more than schemaless flexibility at this stage.\n3. **Requirement — prompt decision:** The merchant needs an immediate approve/decline/unknown answer. **Choice:** synchronous processing for the authorization decision. **Why:** an entirely asynchronous response does not satisfy that interface.\n4. **Requirement — decoupled side effects:** Reporting and notifications must not increase payment latency. **Choice:** publish events after committing state, using a transactional outbox. **Why:** prevents a database commit succeeding while an independent event publish fails silently.\n5. **Requirement — ambiguous provider result:** A timeout is not a decline. **Choice:** represent `UNKNOWN/PENDING`, query or reconcile external status, and only retry according to provider idempotency rules. **Why:** blind retries may duplicate charges.\n6. **Requirement — sensitive data:** Minimize raw card data propagation. **Choice:** tokenization, tight access controls, encrypted transport and storage, audit logging. **Why:** reduce exposure and compliance scope.\n\n```text\nMerchant\n   |\n   v\nAPI Gateway --\u003e AuthN/AuthZ / request limits\n   |\n   v\nPayment API --\u003e Idempotency + payment state DB\n   |\n   v\nAuthorization adapter --\u003e External network/processor\n   |\n   +--\u003e Result/state update --\u003e Transactional outbox\n                                  |\n                                  v\n                             Event transport\n                                  |\n                                  +--\u003e Notifications\n                                  +--\u003e Analytics\n                                  +--\u003e Reconciliation\n```\n\n**Concepts introduced only when needed:** idempotency (same logical request yields no additional side effect); ACID transaction (atomic, consistent, isolated and durable database work); outbox (publish an event from durable committed state); reconciliation (compare independent records to detect and resolve mismatches).\n\n## 3. Module 1 — Architecture Foundations\n\nThese are **20 connected decisions**, not 20 detached lectures. Each one will be revisited in a case study.\n\n| Topic | Learn to reason about | First useful case |\n|---|---|---|\n| 1. Functional vs. quality requirements | What the system does vs. how well it must do it | Payment authorization |\n| 2. Back-of-envelope capacity | Average/peak RPS, data volume, bottlenecks | URL shortener |\n| 3. System boundaries | Who owns state, where trust changes | Payment gateway |\n| 4. API contracts | REST/gRPC/events, versioning, errors, retries | API gateway |\n| 5. Data modeling | Constraints, indexes, keys and state machines | Ledger |\n| 6. Relational vs. NoSQL | Transactions, queries, partitioning, flexibility | Ledger vs. feed |\n| 7. Consistency | Strong, eventual; stale reads; read-your-writes | Booking |\n| 8. Replication | Read scaling, availability, failover lag | Multi-region reads |\n| 9. Partitioning/sharding | Capacity, hot keys, routing, rebalancing | Event pipeline |\n| 10. Caching | Hit rate, invalidation, TTL, stampede | News feed |\n| 11. Message queues | Worker decoupling, retries, dead-letter queues | Notifications |\n| 12. Event streams | Ordering, partition keys, replay, consumer groups | Fraud stream |\n| 13. Distributed transactions | ACID locality, Saga, compensations | Checkout |\n| 14. Idempotency | Retry without extra business effect | Payments |\n| 15. Concurrency | Race conditions, optimistic/pessimistic locking | Ticketing |\n| 16. Backpressure | Bound load when downstream systems slow | Ingestion |\n| 17. Resilience | Timeouts, retries, circuit breakers, bulkheads | Payment gateway |\n| 18. Observability | Logs, metrics, traces, business invariants | Authorization |\n| 19. Security by design | Authentication, authorization, threat boundaries | IAM/token vault |\n| 20. Operational architecture | SLOs, DR, rollout, runbooks and cost | Active-passive DR |\n\n### Foundational rules of thumb — with limitations\n\n- **Do not default to microservices.** Start with cohesive boundaries; split when independent ownership, scaling or deployment justifies it.\n- **Do not cache correctness-critical balances as the source of truth.** A cache can accelerate reads but needs an explicit freshness contract.\n- **Do not assume “exactly once” across arbitrary external systems.** Combine at-least-once delivery with idempotent business effects and reconciliation where needed.\n- **Do not treat network timeout as operation failure.** Model ambiguous outcomes explicitly.\n- **Do not introduce multi-region writes casually.** Consistency and conflict resolution can dominate the design.\n- **Do not name a database before describing the access patterns and invariants.**\n\n## 4. Module 2 — Payments and Financial Systems\n\n**Priority: highest domain depth.** Trace authorization, clearing, settlement, dispute and audit as **distinct phases**; do not flatten them into a single database write.\n\n| # | Design problem | Why this case matters / critical choices |\n|---:|---|---|\n| 1 | Credit-card authorization | Low-latency synchronous decision; idempotency; uncertain responses; risk checks |\n| 2 | Merchant payment gateway | API authentication, partner integration, retry contracts, provider failures |\n| 3 | Capture, clearing and settlement | Different financial phases; batch/event workflows; finality and reconciliation |\n| 4 | Multi-provider payment orchestration | Routing, circuit breakers, provider-specific semantics, fallback safety |\n| 5 | Double-entry financial ledger | Debit/credit invariants; immutable entries; transactional posting; auditability |\n| 6 | Refunds and reversals | State machine, partial refunds, duplicate requests, external status |\n| 7 | Chargebacks/disputes | Long-running workflow, deadlines, evidence, exception queues |\n| 8 | Peer-to-peer transfer | Atomic ledger entries, holds, concurrency, recipient identity |\n| 9 | Recurring billing/subscriptions | Scheduling, retry policy, failed payments, idempotent cycles |\n| 10 | Real-time fraud detection | Feature freshness, scoring latency, rules + models, fail-open/closed trade-off |\n| 11 | Limits and velocity controls | Atomic counters, sliding windows, hot accounts, correct risk decisions |\n| 12 | Merchant onboarding / KYC | Human reviews, third-party checks, long-lived durable orchestration |\n| 13 | Reconciliation engine | Match ledgers to external files/events; discrepancies; reprocessing |\n| 14 | Transaction notifications | Outbox, event consumers, delivery retries, user preferences |\n| 15 | Rewards / loyalty points | Earn/burn events, balances, expiry, reversals and consistency |\n| 16 | Card tokenization vault | Sensitive data isolation, tokens, HSM/KMS, audit and access boundaries |\n\n### Cross-cutting payment concepts to introduce in these designs\n\n- **Financial invariants:** e.g., a balanced ledger posting must not partially commit; define the invariant before choosing storage.\n- **Idempotency scope:** identify the business action, request fingerprint, retention period and response replay rules.\n- **Authorization vs. settlement:** a decision to approve an authorization is not the same as final movement of money.\n- **Exactly-once business effect:** messaging may redeliver; deduplication and atomic state transitions protect the actual financial effect.\n- **Unknown results:** reconcile with independent sources rather than treating timeouts as failure.\n- **PII/cardholder-data boundaries:** classify and minimize data flows; use applicable PCI/security controls.\n- **Fraud vs. reliability:** sometimes a failing risk service implies decline, sometimes controlled fallback; derive it from policy and threat model.\n\n## 5. Module 3 — Scalable Distributed Applications\n\n| # | Design problem | Main architectural choice |\n|---:|---|---|\n| 17 | URL shortener | Unique IDs, key-value lookup, redirects, hot-key caching |\n| 18 | Distributed rate limiter | Token bucket vs. sliding window; atomic distributed counters |\n| 19 | API gateway | Authentication boundary, routing, rate limits, request policies |\n| 20 | Multi-channel notifications | Fan-out, queue vs. stream, retries, dead-letter handling |\n| 21 | Distributed job scheduler | Leader election, claiming work, duplicate-safe execution |\n| 22 | Webhook delivery platform | Delivery contracts, signed payloads, retry windows, backoff |\n| 23 | WhatsApp-style chat | WebSocket vs. polling, ordering, offline delivery, fan-out |\n| 24 | Social media feed | Fan-out on write vs. fan-out on read, celebrity skew |\n| 25 | Search autocomplete | Prefix index/trie, ranking, freshness, cache |\n| 26 | File sharing | Object storage, metadata DB, pre-signed URLs, authorization |\n| 27 | Video streaming | Transcoding jobs, CDN, segments, adaptive bitrate |\n| 28 | E-commerce checkout | State transitions, reservation, payment, order Saga |\n\n### Distinct patterns to extract\n\n- **Read-heavy vs. write-heavy:** drives indexing, denormalization, caching and partitioning.\n- **Push vs. pull:** for chat, feeds and notifications; connection management costs matter.\n- **Fan-out on write vs. read:** precompute for cheap reads or compute on demand for lower write amplification.\n- **Queue vs. log:** a work queue distributes tasks; an event log enables independent consumers/replay, with product-specific semantics.\n- **Object storage vs. database blobs:** separate large content delivery from searchable metadata and authorization.\n\n## 6. Module 4 — Distributed Transactions and Workflows\n\n| # | Design problem | Main architectural choice |\n|---:|---|---|\n| 29 | Inventory reservation | Atomic stock decrement, TTL reservations, expiry races |\n| 30 | Ticket booking | Optimistic vs. pessimistic locking; unique seat constraints |\n| 31 | Driver-to-rider matching | Geospatial index, freshness, claim ownership, concurrency |\n| 32 | Order fulfillment | Saga orchestration vs. choreography; compensating actions |\n| 33 | Coupon redemption | Global limits, per-user uniqueness, hot keys |\n| 34 | Wallet balance | Immutable ledger vs. mutable read model; concurrent spending |\n| 35 | Shipment tracking | Event ingestion, out-of-order events, eventual consistency |\n| 36 | Durable workflow engine | State machines, timers, retries, cancellation and recovery |\n| 37 | Transactional outbox | Atomic data update + durable event intent; relay deduplication |\n| 38 | Idempotent consumer | At-least-once events, inbox table, replay-safe side effects |\n\n### Key distinction\n\nA **database transaction** protects changes inside its transactional boundary. A **Saga** coordinates a longer business workflow across systems; compensation is not the same as magically rolling back completed external actions. Explain what must be compensated, what cannot be undone, and how operators recover stuck workflows.\n\n## 7. Module 5 — Data Architecture and Streaming\n\n| # | Design problem | Main architectural choice |\n|---:|---|---|\n| 39 | Event ingestion pipeline | Brokers, partitions, ordering keys, schema evolution |\n| 40 | Real-time analytics dashboard | Stream aggregations, materialized views, freshness SLA |\n| 41 | Metrics and log platform | High-cardinality cost, time-series storage, retention |\n| 42 | Search indexing pipeline | Source DB vs. derived index; update lag and rebuild |\n| 43 | Change Data Capture | Database log tailing vs. application dual writes |\n| 44 | Data warehouse ETL/ELT | OLTP vs. OLAP, batch vs. incremental, lineage |\n| 45 | Immutable audit trail | Tamper resistance, sequence, retention, access controls |\n| 46 | Customer 360 profile | Identity matching, source-of-truth ownership, privacy |\n| 47 | Data retention and deletion | Policy propagation, legal holds, backups, audit evidence |\n\n### Concepts in context\n\n- **OLTP:** short operational reads/writes, often transactional; **OLAP:** large analytical scans and aggregations.\n- **CDC:** propagate committed database changes through a log rather than trying to write to two systems in one request.\n- **Materialized view:** precomputed read model, with declared staleness and rebuild strategy.\n- **Event time vs. processing time:** late/out-of-order events can affect aggregates; watermarks and correction policy matter.\n- **Data lineage:** know which source, transformation and policy produced a result.\n\n## 8. Module 6 — Scalability, Cloud and Reliability\n\n| # | Design problem | Main architectural choice |\n|---:|---|---|\n| 48 | Multi-region read service | Replicas, latency routing, stale-read tolerance |\n| 49 | Active-passive failover | Regional recovery, replicated state, cutover procedure |\n| 50 | Active-active transactions | Write coordination, conflict resolution, partition tolerance |\n| 51 | Distributed cache tier | Cache-aside, TTL, consistency, stampede prevention |\n| 52 | Flash-sale traffic | Admission control, virtual queues, shed load safely |\n| 53 | Backup and disaster recovery | RPO, RTO, tested restore, data integrity |\n| 54 | Circuit breaker and fallback | Timeouts, retry budgets, bulkheads, failure isolation |\n| 55 | Multi-tenant platform | Isolation, noisy neighbors, cost/accounting boundaries |\n| 56 | Safe deployment pipeline | Canary/blue-green, compatibility, feature flags, rollback |\n\n### Must understand\n\n- **RPO:** maximum acceptable data loss measured in time. **RTO:** maximum acceptable recovery time.\n- **Availability vs. correctness:** degraded reads may be acceptable; incorrect balances or duplicate postings may not be.\n- **Backpressure:** reduce accepted work to what downstream systems can process, rather than filling unlimited queues.\n- **Retry amplification:** nested automatic retries can turn a partial outage into a total one; use bounded budgets and jitter.\n- **Operational readiness:** dashboards, alerts, runbooks, DR tests, ownership and on-call dependencies.\n\n## 9. Module 7 — Security and Enterprise Architecture\n\n| # | Design problem | Main architectural choice |\n|---:|---|---|\n| 57 | Enterprise single sign-on | OIDC/SAML, trust federation, session and token lifetimes |\n| 58 | Multi-factor authentication | Step-up verification, recovery, device trust, risk signals |\n| 59 | Authorization platform | RBAC vs. ABAC, policy evaluation, revocation |\n| 60 | Secrets and key management | KMS/HSM, key lifecycle, rotation, least privilege |\n| 61 | B2B partner API | Contract versioning, mTLS/OAuth, quotas, failure isolation |\n| 62 | Mainframe modernization | Strangler migration, anti-corruption layer, dual-run validation |\n| 63 | Hybrid-cloud integration | Connectivity, trust boundary, egress, latency and ownership |\n| 64 | Cardholder-data boundary | Tokenization, segmentation, audit and PCI scope |\n| 65 | Consent and privacy service | Consent versioning, policy checks, deletion/retention |\n\n### Architecture review lens\n\nFor each major design, answer within the explanation:\n\n- **Business alignment:** Which capability, customer journey or regulatory need is served?\n- **Integration:** Which systems already exist? What are their contracts and failure modes?\n- **Security:** Who is trusted, where does sensitive data move, and who can access it?\n- **Ownership:** Which team supports each service, schema, shared component and incident?\n- **Delivery:** How can it migrate safely with rollback and backward-compatible interfaces?\n- **Cost:** What grows with traffic, storage, redundancy, vendor calls and operational effort?\n- **Governance:** How are decisions documented, reviewed and revised as constraints change?\n\n## 10. Module 8 — Advanced Architecture Breadth\n\n| # | Design problem | Main architectural choice |\n|---:|---|---|\n| 66 | Online ML inference | Feature store freshness, serving latency, safe fallback |\n| 67 | Recommendation system | Candidate retrieval vs. ranking, online/offline features |\n| 68 | Enterprise RAG assistant | Retrieval permissions, data leakage prevention, grounding |\n| 69 | Nearby location search | Spatial indices, cell systems, precision vs. cost |\n| 70 | Collaborative editing | OT vs. CRDT, ordering, offline merge |\n| 71 | Real-time ad auction | Tight latency budget, scoring, budget enforcement |\n| 72 | IoT telemetry platform | Device identity, ingestion bursts, ordering, retention |\n| 73 | Media transcoding | Asynchronous job graph, retries, storage lifecycle |\n\n**Treatment:** Pattern-focused unless a case introduces a genuinely new architecture choice. These extend breadth; they do not replace the financial and enterprise core.\n\n## 11. Sixteen Full-Depth Anchor Designs\n\nThese receive the complete 11-step treatment from the Method section; other cases reuse their patterns and focus on what differs.\n\n| Order | Anchor design | Deep concepts it teaches | Related cases made easier |\n|---:|---|---|---|\n| 1 | Card authorization | Low-latency state machines, idempotency, unknown outcomes | Gateway, refunds, limits |\n| 2 | Double-entry ledger | Atomicity, immutable postings, invariants | Wallet, transfer, rewards |\n| 3 | Settlement + reconciliation | Async phases, files/events, mismatches, reprocessing | Billing, disputes, accounting |\n| 4 | Fraud decisioning | Feature freshness, stream processing, inference fallback | Velocity limits, real-time analytics |\n| 5 | Payment gateway | Partner contracts, retries, resilience, security boundary | B2B API, webhooks |\n| 6 | Distributed rate limiter | Atomic counters, windows, hot keys | Quotas, coupons, risk limits |\n| 7 | E-commerce checkout | Saga and outbox, compensation | Order fulfillment, inventory |\n| 8 | Ticket booking | High contention, locks, transactions | Reservations, coupon limits |\n| 9 | Notification service | Queue semantics, worker pools, deduplication | Webhooks, scheduled jobs |\n| 10 | Chat | WebSockets, ordering, online/offline state | Collaborative editing, live tracking |\n| 11 | News feed | Fan-out patterns, read/write scaling | Recommendations, activity feeds |\n| 12 | Search/indexing service | Materialized index, eventual consistency, rebuilds | Autocomplete, customer search |\n| 13 | Streaming analytics pipeline | Partitions, replay, windows, CDC | Fraud features, metrics |\n| 14 | Multi-region architecture | Failover, replica lag, RPO/RTO | Active-passive, active-active |\n| 15 | Enterprise IAM | Identity federation, policies, revocation | B2B access, tenant isolation |\n| 16 | Legacy modernization | Incremental migration, parallel runs, integration | Hybrid cloud, API modernization |\n\n### Depth rule\n\n**Do not force the same depth on all 73 problems.** Spend conceptual effort where one design introduces a new pattern or a non-obvious failure mode. For variations, explain the changed requirement, changed architecture, and changed trade-off without re-teaching shared basics.\n\n## 12. Architecture Decision Reference\n\n| Decision | Usually choose A when... | Usually choose B when... | Hidden trap to discuss |\n|---|---|---|---|\n| Relational DB vs. NoSQL | Cross-row integrity, relational queries, durable transactions | Data/access patterns justify alternate model or scaling | A NoSQL name alone does not solve scaling |\n| Monolith vs. microservices | Tight coupling, small ownership boundary, deployment simplicity | Independent teams/capabilities need separate deployment | Distributed operations cost |\n| REST vs. gRPC | External/public contracts, broad interoperability | Internal typed RPC and efficiency matter | Versioning and observability |\n| Request/response vs. events | Caller needs an immediate answer | Work can complete independently or be replayed | False assumption of immediate consistency |\n| Work queue vs. event log | Tasks should be processed by workers | Multiple consumers need durable event history | Ordering/replay semantics differ |\n| Strong vs. eventual consistency | Correctness needs latest state now | Staleness has explicit safe bounds | User-visible invariants |\n| ACID transaction vs. Saga | All updates share transaction boundary | Multiple independently committed systems | Compensation is not full rollback |\n| Optimistic vs. pessimistic lock | Conflicts are infrequent | Contention is high, blocking acceptable | Deadlocks and retries |\n| Cache-aside vs. write-through | App controls missing/read behavior | Fresh cache writes are worth write coupling | Invalidation and drift |\n| Replication vs. sharding | Availability/read scaling is goal | Write/storage capacity exceeds one shard | Hot keys and cross-shard queries |\n| Normalized vs. denormalized | Write integrity and canonical data | Read pattern warrants derived projections | Update lag and recomputation |\n| CQRS vs. unified model | Read/write workloads diverge sharply | Simpler model meets requirements | Projection rebuild and drift |\n| Polling vs. WebSocket | Updates are infrequent and latency loose | Frequent low-latency bidirectional updates | Connection load and reconnection |\n| Single-region vs. multi-region | Simpler consistency and sufficient DR | Availability/latency/data policy justify regions | Cross-region data correctness |\n| Active-passive vs. active-active | Simpler failover with accepted RTO | Continuous regional serving is essential | Write conflicts and split brain |\n| Orchestration vs. choreography | Central visibility and business process control | Loosely coupled independent event reactions | Hidden workflow dependencies |\n| Fail-open vs. fail-closed | Degradation is safe and policy permits | Denying unsafe operations is required | Risk must be explicitly owned |\n| Managed vs. self-hosted | Reduced operational burden is valuable | Specific control/constraints justify ownership | Exit, cost, and support model |\n| Batch vs. streaming | Freshness is not urgent, throughput matters | Low-latency updates create business value | Event time and late data |\n| Build vs. buy | Differentiation, control or integration justify build | Mature capability can be procured safely | Vendor SLA, portability, lock-in |\n\n**Decision explanation pattern:** State the constraint -\u003e identify at least two credible options -\u003e choose one -\u003e name the cost or failure mode it introduces -\u003e define when to revisit it.\n\n## 13. Learning Order — Dependency-Driven, Not Timed\n\nThe study sequence follows concept dependencies. No clocks, exercises or assessments are included.\n\n### Pass A — Establish the minimum vocabulary\n\nCover Module 1 while immediately illustrating each concept with payment authorization, URL shortener, ticket booking, notifications and a ledger. Do not defer practice designs until after a large theory chapter.\n\n### Pass B — Financial correctness core\n\nWalk through **card authorization -\u003e ledger -\u003e settlement/reconciliation -\u003e fraud decisioning -\u003e payment gateway**. These are related but have different latency, consistency, failure and data-retention constraints.\n\n### Pass C — General distributed patterns\n\nUse **rate limiter -\u003e notification service -\u003e checkout/Saga -\u003e ticket booking -\u003e chat -\u003e feed -\u003e search**. This covers atomic counters, work queues, workflows, concurrency, persistent connections, fan-out and indexes.\n\n### Pass D — Data, scale and reliability\n\nUse **streaming analytics -\u003e CDC -\u003e multi-region and disaster recovery -\u003e caching/failover**. Contrast correctness-preserving write paths with eventually consistent projections.\n\n### Pass E — Solution Architect lens\n\nUse **IAM -\u003e partner integrations -\u003e legacy modernization -\u003e hybrid cloud**. Cover architecture governance, cloud/on-prem boundaries, incremental migration, operating model, security and cost.\n\n### Pass F — Complete breadth\n\nProcess the remaining case catalog as targeted variations. Prioritize new patterns, not repetition of technologies already understood.\n\n### Material deliberately excluded\n\n- Timed schedules and calendar allocations.\n- Quizzes, mock interviews, assessments or scorecards.\n- Product-name memorization without underlying trade-off reasoning.\n- Unsupported claims about American Express's internal interview questions or private architecture.\n\n## 14. Reusable Case-Study Template\n\nCopy this structure when we begin any problem:\n\n1. **Problem statement:** User journey, actors and business purpose.\n2. **Functional requirements:** Essential operations; explicitly excluded scope.\n3. **Quality requirements:** Priority-order correctness, security, latency, reliability, throughput, cost.\n4. **Assumptions and rough capacity:** Numbers only when grounded or explicitly illustrative.\n5. **Interfaces:** Endpoints, events, auth, idempotency and error semantics.\n6. **Data and invariants:** Schemas, unique constraints, source of truth, lifecycle.\n7. **Baseline ASCII diagram:** Minimal architecture and request flow.\n8. **Decision-by-decision derivation:** Requirement -\u003e options -\u003e choice -\u003e why -\u003e trade-off.\n9. **Critical sequences:** Success, duplicate, timeout, partial failure, recovery.\n10. **Scale, resilience and security:** Bottlenecks, monitoring, rollback, operational playbooks.\n11. **Final architecture:** Consolidated ASCII diagram and remaining risks.\n12. **What changes if constraints change:** A small set of meaningful variations, with no assessment questions.\n\n### Explanation style\n\n- Define **CQRS**, **Saga**, **CDC**, **outbox**, **sharding**, **replication**, **tokenization**, **HSM**, **RTO/RPO**, etc. in one or two sentences **where first needed**.\n- Prefer **ASCII diagrams** over graphics.\n- Highlight **the invariant or requirement** before naming technology.\n- Make uncertain assumptions explicit; never present illustrative capacity estimates as company facts.\n- Include operational and enterprise implications, not just API and database choices.\n\n## 15. References and Boundaries\n\nThe preparation roadmap is a practical synthesis of generally applicable architecture patterns, not a representation of American Express internal systems or a verified interview question bank.\n\nOfficial references to consult when a specific concept is taught:\n\n- **AWS Well-Architected Framework:** https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html — architecture quality, security, reliability, performance, cost and operations.\n- **NIST SP 800-207, Zero Trust Architecture:** https://csrc.nist.gov/pubs/sp/800/207/final — trust boundaries and access principles.\n- **PCI Security Standards Council Document Library:** https://www.pcisecuritystandards.org/document_library/ — current PCI DSS materials; verify applicable standard/version before asserting requirements.\n- **American Express Careers:** https://www.americanexpress.com/en-us/careers/ — public role context, not a predictor of a specific interview.\n\n**PDF/export note:** The accompanying offline converter generates the same tabbed HTML reader from this Markdown. Its **Export PDF** action opens the browser print dialog; select **Save as PDF**. No cloud service or external libraries are required. Browsers control the final PDF filename and print settings.\n";</script>
<script>
    (function () {
        'use strict';
        const MD = window.PLAN_MARKDOWN || '';
        const ESC = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const safeUrl = u => {
            const val = String(u).trim();
            return /^(https?:\/\/|mailto:|#)/i.test(val) ? val : '#';
        };

        function inline(s) {
            let t = ESC(s), slots = [];
            t = t.replace(/`([^`]+)`/g, (_, x) => {
                const k = '@@INLINE' + slots.length + '@@';
                slots.push('<code>' + x + '</code>');
                return k;
            });
            t = t.replace(/\[([^\]]+)\]\(([^\s)]+)\)/g, (_, label, url) => '<a href="' + ESC(safeUrl(url.replace(/&amp;/g, '&'))) + '" rel="noopener noreferrer" target="_blank">' + label + '</a>');
            t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>');
            t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
            t = t.replace(/~~(.+?)~~/g, '<del>$1</del>');
            t = t.replace(/@@INLINE(\d+)@@/g, (_, i) => slots[Number(i)] || '');
            return t;
        }

        function isRule(l) {
            return /^\s*(?:---+|\*\*\*+|___+)\s*$/.test(l);
        }

        function isFence(l) {
            return /^\s*```/.test(l);
        }

        function isHeading(l) {
            return /^#{1,6}\s+/.test(l);
        }

        function isList(l) {
            return /^\s{0,3}(?:[-*+]\s+|\d+[.)]\s+)/.test(l);
        }

        function isTableSep(l) {
            return /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(l);
        }

        function cells(row) {
            let t = row.trim();
            if (t.startsWith('|')) t = t.slice(1);
            if (t.endsWith('|')) t = t.slice(0, -1);
            return t.split(/(?<!\\)\|/).map(x => x.replace(/\\\|/g, '|').trim());
        }

        function renderMarkdown(src) {
            const a = String(src).replace(/\r\n?/g, '\n').split('\n'), out = [];
            let i = 0;

            function boundary(k) {
                const l = a[k] || '';
                return !l.trim() || isFence(l) || isHeading(l) || isRule(l) || isList(l) || /^>/.test(l) || ((k + 1) < a.length && l.includes('|') && isTableSep(a[k + 1] || ''));
            }

            while (i < a.length) {
                let l = a[i];
                if (!l.trim()) {
                    i++;
                    continue;
                }
                if (isFence(l)) {
                    const lang = l.trim().slice(3).trim().replace(/[^a-zA-Z0-9_-]/g, '');
                    i++;
                    const cs = [];
                    while (i < a.length && !isFence(a[i])) cs.push(a[i++]);
                    if (i < a.length) i++;
                    out.push('<pre><code' + (lang ? ' class="language-' + lang + '"' : '') + '>' + ESC(cs.join('\n')) + '</code></pre>');
                    continue;
                }
                const h = l.match(/^(#{1,6})\s+(.+)$/);
                if (h) {
                    const n = h[1].length;
                    out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>');
                    i++;
                    continue;
                }
                if (isRule(l)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }
                if (i + 1 < a.length && l.includes('|') && isTableSep(a[i + 1])) {
                    const headers = cells(l);
                    i += 2;
                    const trs = [];
                    while (i < a.length && a[i].trim() && a[i].includes('|')) {
                        trs.push(cells(a[i]));
                        i++;
                    }
                    let s = '<div class="table-scroll"><table><thead><tr>' + headers.map(v => '<th>' + inline(v) + '</th>').join('') + '</tr></thead><tbody>';
                    for (const rr of trs) {
                        s += '<tr>' + headers.map((_, idx) => '<td>' + inline(rr[idx] || '') + '</td>').join('') + '</tr>';
                    }
                    out.push(s + '</tbody></table></div>');
                    continue;
                }
                if (/^>/.test(l)) {
                    let chunks = [];
                    while (i < a.length && /^>/.test(a[i])) chunks.push(a[i++].replace(/^>\s?/, ''));
                    out.push('<blockquote>' + chunks.map(x => '<p>' + inline(x) + '</p>').join('') + '</blockquote>');
                    continue;
                }
                if (isList(l)) {
                    const ordered = /^\s{0,3}\d+[.)]\s+/.test(l),
                        tag = ordered ? 'ol' : 'ul';

                    while (i < a.length && isList(a[i]) && (/^\s{0,3}\d+[.)]\s+/.test(a[i]) === ordered)) {
                        let item = a[i++].replace(/^\s{0,3}(?:[-*+]\s+|\d+[.)]\s+)/, '');
                        const task = item.match(/^\[([ xX])\]\s+(.*)$/);
                        if (task) item = '<input type="checkbox" disabled ' + (task[1].toLowerCase() === 'x' ? 'checked ' : '') + 'aria-label="Task status"> ' + task[2];
                        items.push('<li>' + inline(item) + '</li>');
                    }
                    out.push('<' + tag + '>' + items.join('') + '</' + tag + '>');
                    continue;
                }
                let p = [l];
                i++;
                while (i < a.length && !boundary(i)) {
                    p.push(a[i]);
                    i++;
                }
                out.push('<p>' + p.map(inline).join(' ').replace(/  +/g, ' ') + '</p>');
            }
            return out.join('\n');
        }

        function stripMd(s) {
            return String(s).replace(/[`*_~]/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').trim();
        }

        function sectionsFor(md) {
            const lines = String(md).replace(/\r\n?/g, '\n').split('\n');
            const titleLine = lines.find(l => /^#\s+/.test(l));
            const title = titleLine ? stripMd(titleLine.replace(/^#\s+/, '')) : 'Markdown plan';
            let parts = [];
            let cur = null;
            let intro = [];
            let fence = false;
            for (const line of lines) {
                if (/^\s*```/.test(line)) fence = !fence;
                if (!fence && /^##\s+/.test(line)) {
                    if (cur) parts.push(cur);
                    cur = {
                        title: stripMd(line.replace(/^##\s+/, '')),
                        lines: []
                    };
                } else if (cur) {
                    cur.lines.push(line);
                } else if (!/^#\s+/.test(line)) {
                    intro.push(line);
                }
            }
            if (cur) parts.push(cur);
            if (!parts.length) {
                parts = [{
                    title: 'Document',
                    lines: lines.filter(l => !/^#\s+/.test(l))
                }];
                intro = [];

                title,
                intro: renderMarkdown(intro.join('\n')),
                parts: parts.map((p, i) => ({
                    id: 'tab-' + i,
                    title: p.title,
                    html: renderMarkdown(p.lines.join('\n')),
                    raw: p.lines.join('\n')

        }

        function download(name, blob) {

            a.download = name;

            a.click();
            a.remove();

        }

        const data = sectionsFor(MD),
            header = document.querySelector('#planTitle'),
            lede = document.querySelector('#planIntro'),
            bar = document.querySelector('#tabs'),
            panel = document.querySelector('#sections'),
            search = document.querySelector('#search'),
            count = document.querySelector('#matchCount');
        header.textContent = data.title;
        lede.innerHTML = data.intro || '<p>Architecture case-study plan. Use the tabs to navigate.</p>';
        const all = [];
        for (const section of data.parts) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'tab';
            b.setAttribute('role', 'tab');
            b.id = 'tab-button-' + section.id;
            b.setAttribute('aria-controls', section.id);
            b.textContent = section.title;
            const article = document.createElement('section');

            article.setAttribute('role', 'tabpanel');

            const item = {...section, button: b, article: article};
            all.push(item);
            b.addEventListener('click', () => activate(item.id));
        }
        let active = all[0]?.id;

        function activate(id) {
            const target = all.find(x => x.id === id && !x.button.hidden) || all.find(x => !x.button.hidden);
            if (!target) return;
            active = target.id;
            all.forEach(x => {

                x.article.hidden = !on;

        function onSearch() {
            const q = search.value.trim().toLowerCase();
            let n = 0;
            for (const x of all) {
                const isMatch = !q || (x.title + ' ' + x.raw).toLowerCase().includes(q);

                if (isMatch) n++;

            if (n === 0) all.forEach(x => x.article.hidden = true);
        }

        search.addEventListener('input', onSearch);
        bar.addEventListener('keydown', e => {
            if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) return;
            const items = all.filter(x => !x.button.hidden);
            let index = items.findIndex(x => x.id === active);
            if (e.key === 'Home') index = 0; else if (e.key === 'End') index = items.length - 1; else index = (index + (e.key === 'ArrowRight' ? 1 : -1) + items.length) % items.length;
            if (items[index]) {
                activate(items[index].id);
                items[index].button.focus();
            }
            e.preventDefault();
        });
        document.getElementById('downloadMd').addEventListener('click', () => download('system_design_interview_plan.md', new Blob([MD], {type: 'text/markdown;charset=utf-8'})));
        document.getElementById('printPdf').addEventListener('click', () => window.print());
        document.getElementById('showAll').addEventListener('click', () => {
            search.value = '';
            onSearch();
            const shown = all.every(x => !x.article.hidden);
            if (shown) {
                activate(active || all[0]?.id);
                document.getElementById('showAll').textContent = 'Show all sections';
            } else {
                all.forEach(x => {
                    x.article.hidden = false;
                    x.button.setAttribute('aria-selected', String(x.id === active));
                });
                document.getElementById('showAll').textContent = 'Return to tabs';
            }
        });
        activate(active);
        onSearch();
    })();
</script>
</body>
</html>
